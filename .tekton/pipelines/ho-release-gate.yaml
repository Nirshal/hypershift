apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ho-release-gate
spec:
  params:
  - name: SNAPSHOT
    type: string
    description: JSON payload of the Konflux Snapshot (injected by Integration Service)
  - name: e2e-blocking-job-names
    type: string
    description: JSON array of blocking Prow periodic job names (gate fails if any fail)
    default: '[]'
  - name: e2e-informing-job-names
    type: string
    description: JSON array of informing Prow periodic job names (reported but do not block the gate)
    default: '[]'
  - name: gate-label
    type: string
    description: Label identifying which service release gate this is (e.g. ARO HCP)
    default: "ARO HCP"
  - name: release-plan-name
    type: string
    description: Name of the ReleasePlan to reference when creating the Release CR

  tasks:
  - name: extract-image
    taskSpec:
      params:
      - name: SNAPSHOT
        type: string
      results:
      - name: ho-image
        description: Validated HO image reference
      - name: snapshot-name
        description: Snapshot name (from PipelineRun label)
      steps:
      - name: validate
        image: quay.io/konflux-ci/appstudio-utils:latest
        env:
        - name: HOME
          value: /tekton/home
        - name: SNAPSHOT_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['appstudio.openshift.io/snapshot']
        script: |
          #!/bin/bash
          set -euo pipefail

          echo -n "unknown" > $(results.snapshot-name.path)
          echo -n "unknown" > $(results.ho-image.path)

          SNAPSHOT_JSON='$(params.SNAPSHOT)'

          echo "=== extract-image ==="
          echo "Snapshot:  ${SNAPSHOT_NAME}"

          HO_IMAGE=$(echo "${SNAPSHOT_JSON}" | jq -r '.components[] | select(.name=="hypershift-operator-main") | .containerImage')

          if [[ -z "${HO_IMAGE}" || "${HO_IMAGE}" == "null" ]]; then
            echo "ERROR: could not extract HO image from SNAPSHOT JSON"
            echo "SNAPSHOT JSON: ${SNAPSHOT_JSON}"
            exit 1
          fi

          echo "HO image:  ${HO_IMAGE}"

          DIGEST=$(echo "${HO_IMAGE}" | grep -oP 'sha256:[a-f0-9]+' || echo "N/A")
          echo "Digest:    ${DIGEST}"

          REVISION=$(echo "${SNAPSHOT_JSON}" | jq -r '.components[] | select(.name=="hypershift-operator-main") | .source.git.revision' || echo "N/A")
          echo "Commit:    ${REVISION}"

          echo "=== validation passed ==="

          echo -n "${HO_IMAGE}" > $(results.ho-image.path)
          echo -n "${SNAPSHOT_NAME}" > $(results.snapshot-name.path)
    params:
    - name: SNAPSHOT
      value: $(params.SNAPSHOT)

  - name: run-e2e
    runAfter: [extract-image]
    timeout: "5h30m0s"
    taskSpec:
      params:
      - name: ho-image
        type: string
      - name: e2e-blocking-job-names
        type: string
      - name: e2e-informing-job-names
        type: string
      results:
      - name: results-json
        description: "JSON array of per-job results: [{job, result, url}, ...]"
      steps:
      - name: trigger-and-poll
        image: quay.io/konflux-ci/appstudio-utils:latest
        script: |
          #!/bin/bash
          set -euo pipefail

          echo "=== run-e2e: MOCK MODE - skipping Prow jobs ==="

          BLOCKING_JSON='$(params.e2e-blocking-job-names)'
          INFORMING_JSON='$(params.e2e-informing-job-names)'
          NUM_BLOCKING=$(echo "${BLOCKING_JSON}" | jq -r 'length')
          NUM_INFORMING=$(echo "${INFORMING_JSON}" | jq -r 'length')

          RESULTS="["
          FIRST=true
          for JOB_TYPE in blocking informing; do
            if [[ "${JOB_TYPE}" == "blocking" ]]; then
              SRC_JSON="${BLOCKING_JSON}"
              SRC_COUNT=${NUM_BLOCKING}
            else
              SRC_JSON="${INFORMING_JSON}"
              SRC_COUNT=${NUM_INFORMING}
            fi
            for i in $(seq 0 $((SRC_COUNT - 1))); do
              JOB=$(echo "${SRC_JSON}" | jq -r ".[$i]")
              [[ "${FIRST}" == "true" ]] && FIRST=false || RESULTS+=","
              RESULTS+="{\"job\":\"${JOB}\",\"result\":\"passed\",\"url\":\"https://mock-test\",\"type\":\"${JOB_TYPE}\"}"
            done
          done
          RESULTS+="]"

          echo "Mock results: ${RESULTS}"
          echo -n "${RESULTS}" > $(results.results-json.path)
    params:
    - name: ho-image
      value: $(tasks.extract-image.results.ho-image)
    - name: e2e-blocking-job-names
      value: $(params.e2e-blocking-job-names)
    - name: e2e-informing-job-names
      value: $(params.e2e-informing-job-names)

  - name: evaluate-results
    runAfter: [run-e2e]
    taskSpec:
      params:
      - name: results-json
        type: string
      results:
      - name: gate-passed
        description: Whether the release gate passed (true/false)
      steps:
      - name: evaluate
        image: quay.io/konflux-ci/appstudio-utils:latest
        script: |
          #!/bin/bash
          set -euo pipefail

          echo -n "false" > $(results.gate-passed.path)

          RESULTS_JSON='$(params.results-json)'

          echo "=== evaluate-results ==="
          echo ""

          GATE_PASSED="true"

          BLOCKING_COUNT=$(echo "${RESULTS_JSON}" | jq '[.[] | select(.type == "blocking")] | length')
          INFORMING_COUNT=$(echo "${RESULTS_JSON}" | jq '[.[] | select(.type == "informing")] | length')

          echo "--- BLOCKING TESTS (${BLOCKING_COUNT}) ---"
          printf "%-50s %-10s %s\n" "JOB" "RESULT" "URL"
          printf "%-50s %-10s %s\n" "---" "------" "---"
          for i in $(seq 0 $((BLOCKING_COUNT - 1))); do
            JOB=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"blocking\")][$i].job" | sed 's/periodic-ci-openshift-hypershift-release-5.0-periodics-//')
            RESULT=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"blocking\")][$i].result")
            URL=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"blocking\")][$i].url")
            printf "%-50s %-10s %s\n" "${JOB}" "${RESULT}" "${URL}"
            if [[ "${RESULT}" != "passed" ]]; then
              GATE_PASSED="false"
            fi
          done

          if [[ ${INFORMING_COUNT} -gt 0 ]]; then
            echo ""
            echo "--- INFORMING TESTS (${INFORMING_COUNT}) ---"
            printf "%-50s %-10s %s\n" "JOB" "RESULT" "URL"
            printf "%-50s %-10s %s\n" "---" "------" "---"
            INFORMING_WARNINGS=0
            for i in $(seq 0 $((INFORMING_COUNT - 1))); do
              JOB=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"informing\")][$i].job" | sed 's/periodic-ci-openshift-hypershift-release-5.0-periodics-//')
              RESULT=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"informing\")][$i].result")
              URL=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"informing\")][$i].url")
              printf "%-50s %-10s %s\n" "${JOB}" "${RESULT}" "${URL}"
              if [[ "${RESULT}" != "passed" ]]; then
                INFORMING_WARNINGS=$((INFORMING_WARNINGS + 1))
              fi
            done
            if [[ ${INFORMING_WARNINGS} -gt 0 ]]; then
              echo ""
              echo "WARN: ${INFORMING_WARNINGS} informing test(s) failed (does not affect gate verdict)"
            fi
          fi

          echo ""
          echo "Gate verdict: ${GATE_PASSED} (${BLOCKING_COUNT} blocking, AND logic)"
          echo -n "${GATE_PASSED}" > $(results.gate-passed.path)

          if [[ "${GATE_PASSED}" == "false" ]]; then
            echo ""
            echo "=== GATE FAILED - image will NOT be promoted ==="
          else
            echo ""
            echo "=== GATE PASSED - create-release will create the Release CR ==="
          fi
    params:
    - name: results-json
      value: $(tasks.run-e2e.results.results-json)

  - name: create-release
    runAfter: [evaluate-results]
    taskSpec:
      params:
      - name: gate-passed
        type: string
      - name: snapshot-name
        type: string
      - name: release-plan-name
        type: string
      results:
      - name: release-name
        description: Name of the created Release CR (or N/A if gate failed)
      steps:
      - name: create
        image: quay.io/konflux-ci/appstudio-utils:latest
        script: |
          #!/bin/bash
          set -euo pipefail

          echo -n "N/A" > $(results.release-name.path)

          GATE_PASSED="$(params.gate-passed)"
          SNAPSHOT="$(params.snapshot-name)"
          RELEASE_PLAN="$(params.release-plan-name)"

          if [[ "${GATE_PASSED}" != "true" ]]; then
            echo "=== create-release: gate did not pass - skipping ==="
            echo -n "N/A" > $(results.release-name.path)
            exit 1
          fi

          echo "=== create-release ==="
          echo "Running as: $(oc whoami)"
          echo "Snapshot:     ${SNAPSHOT}"
          echo "ReleasePlan:  ${RELEASE_PLAN}"

          set +e
          RELEASE_NAME=$(oc create -f - -o jsonpath='{.metadata.name}' <<EOFRELEASE
          apiVersion: appstudio.redhat.com/v1alpha1
          kind: Release
          metadata:
            generateName: ${RELEASE_PLAN}-
            labels:
              release.appstudio.openshift.io/author: rh-ee-alesross
          spec:
            releasePlan: ${RELEASE_PLAN}
            snapshot: ${SNAPSHOT}
          EOFRELEASE
          )
          CREATE_RC=$?
          set -e

          if [[ ${CREATE_RC} -ne 0 ]]; then
            echo "ERROR: Failed to create Release CR (exit code ${CREATE_RC})"
            echo -n "N/A" > $(results.release-name.path)
            exit 1
          fi

          echo "Release created: ${RELEASE_NAME}"
          echo -n "${RELEASE_NAME}" > $(results.release-name.path)
    params:
    - name: gate-passed
      value: $(tasks.evaluate-results.results.gate-passed)
    - name: snapshot-name
      value: $(tasks.extract-image.results.snapshot-name)
    - name: release-plan-name
      value: $(params.release-plan-name)

  finally:
  - name: notify-slack
    taskSpec:
      params:
      - name: snapshot-name
        type: string
      - name: results-json
        type: string
      - name: gate-passed
        type: string
      - name: gate-label
        type: string
      - name: release-name
        type: string
      steps:
      - name: send-notification
        image: quay.io/konflux-ci/appstudio-utils:latest
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-webhook
              key: url
        script: |
          #!/bin/bash
          set -euo pipefail

          SNAPSHOT="$(params.snapshot-name)"
          RESULTS_JSON='$(params.results-json)'
          GATE_PASSED="$(params.gate-passed)"
          GATE_LABEL="TEST - IGNORE THIS!"
          RELEASE_NAME="$(params.release-name)"
          PIPELINE_RUN="$(context.pipelineRun.name)"

          echo "=== notify-slack ==="
          echo "Snapshot:     ${SNAPSHOT}"
          echo "PipelineRun:  ${PIPELINE_RUN}"
          echo "Gate passed:  ${GATE_PASSED}"
          echo "Gate label:   ${GATE_LABEL}"
          echo "Release:      ${RELEASE_NAME}"

          KONFLUX_BASE="https://konflux-ui.apps.stone-prd-rh01.pg1f.p1.openshiftapps.com/ns/crt-redhat-acm-tenant/applications/hypershift-operator"

          if [[ "${RELEASE_NAME}" != "N/A" && -n "${RELEASE_NAME}" ]]; then
            RELEASE_FIELD="<${KONFLUX_BASE}/releases/${RELEASE_NAME}/|${RELEASE_NAME}>"
          else
            RELEASE_FIELD="N/A"
          fi

          if [[ "${GATE_PASSED}" == "true" ]]; then
            COLOR="#2E7D32"
            HEADER=":white_check_mark: *HO Release Gate [${GATE_LABEL}] PASSED*"
          else
            COLOR="#D32F2F"
            HEADER=":x: *HO Release Gate [${GATE_LABEL}] FAILED*"
          fi

          format_results() {
            local TYPE="$1"
            local LABEL="$2"
            local LINES=""
            local COUNT
            COUNT=$(echo "${RESULTS_JSON}" | jq "[.[] | select(.type == \"${TYPE}\")] | length")
            if [[ ${COUNT} -eq 0 ]]; then
              return
            fi
            LINES="\\n*${LABEL}:*"
            for i in $(seq 0 $((COUNT - 1))); do
              JOB=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"${TYPE}\")][$i].job" | sed 's/periodic-ci-openshift-hypershift-release-5.0-periodics-//')
              RESULT=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"${TYPE}\")][$i].result")
              URL=$(echo "${RESULTS_JSON}" | jq -r "[.[] | select(.type == \"${TYPE}\")][$i].url")
              if [[ "${RESULT}" == "passed" ]]; then
                EMOJI=":white_check_mark:"
              else
                EMOJI=":red_circle:"
              fi
              if [[ -n "${URL}" && "${URL}" != "null" ]]; then
                LINES="${LINES}\\n${EMOJI} \`${JOB}\` - ${RESULT} (<${URL}|Prow>)"
              else
                LINES="${LINES}\\n${EMOJI} \`${JOB}\` - ${RESULT}"
              fi
            done
            echo -n "${LINES}"
          }

          RESULT_LINES=""
          if [[ -n "${RESULTS_JSON}" ]] && echo "${RESULTS_JSON}" | jq empty 2>/dev/null; then
            RESULT_LINES+=$(format_results "blocking" "Blocking Tests")
            INFORMING_LINES=$(format_results "informing" "Informing Tests")
            if [[ -n "${INFORMING_LINES}" ]]; then
              RESULT_LINES+="\\n${INFORMING_LINES}"
            fi
          else
            RESULT_LINES="\\n:x: Pipeline failed before tests started. Check PipelineRun logs."
          fi

          PAYLOAD=$(cat <<EOFPAYLOAD
          {
            "attachments": [{
              "color": "${COLOR}",
              "blocks": [
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "${HEADER}"}
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Snapshot:*\n${SNAPSHOT}"},
                    {"type": "mrkdwn", "text": "*PipelineRun:*\n<${KONFLUX_BASE}/pipelineruns/${PIPELINE_RUN}/|${PIPELINE_RUN}>"},
                    {"type": "mrkdwn", "text": "*Release:*\n${RELEASE_FIELD}"}
                  ]
                },
                {"type": "divider"},
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "${RESULT_LINES}"}
                }
              ]
            }]
          }
          EOFPAYLOAD
          )

          SLACK_RETRIES=3
          SLACK_RETRY_DELAY=10
          SLACK_SENT=false

          for attempt in $(seq 1 ${SLACK_RETRIES}); do
            set +e
            CURL_OUTPUT=$(curl -sS -w '\n%{http_code}' -X POST \
              -H 'Content-type: application/json' \
              --data "${PAYLOAD}" \
              "${SLACK_WEBHOOK_URL}" 2>&1)
            CURL_RC=$?
            set -e

            HTTP_CODE=$(echo "${CURL_OUTPUT}" | tail -1)
            CURL_BODY=$(echo "${CURL_OUTPUT}" | sed '$d')

            if [[ ${CURL_RC} -ne 0 ]]; then
              echo "ERROR: curl failed (exit code ${CURL_RC}, attempt ${attempt}/${SLACK_RETRIES})"
              echo "  curl output: ${CURL_BODY}"
              if [[ ${attempt} -lt ${SLACK_RETRIES} ]]; then
                echo "  retrying in ${SLACK_RETRY_DELAY}s..."
                sleep ${SLACK_RETRY_DELAY}
              fi
              continue
            fi

            if [[ "${HTTP_CODE}" == "200" ]]; then
              echo "Slack notification sent (attempt ${attempt})"
              SLACK_SENT=true
              break
            else
              echo "WARN: Slack returned HTTP ${HTTP_CODE} (attempt ${attempt}/${SLACK_RETRIES})"
              echo "  response: ${CURL_BODY}"
              if [[ ${attempt} -lt ${SLACK_RETRIES} ]]; then
                echo "  retrying in ${SLACK_RETRY_DELAY}s..."
                sleep ${SLACK_RETRY_DELAY}
              fi
            fi
          done

          if [[ "${SLACK_SENT}" != "true" ]]; then
            echo "ERROR: Slack notification failed after ${SLACK_RETRIES} attempts"
          fi
          echo "=== notify-slack: done ==="
    params:
    - name: snapshot-name
      value: $(tasks.extract-image.results.snapshot-name)
    - name: results-json
      value: $(tasks.run-e2e.results.results-json)
    - name: gate-passed
      value: $(tasks.evaluate-results.results.gate-passed)
    - name: gate-label
      value: $(params.gate-label)
    - name: release-name
      value: $(tasks.create-release.results.release-name)

  - name: notify-slack-error
    when:
    - input: $(tasks.create-release.status)
      operator: in
      values: ["None"]
    taskSpec:
      steps:
      - name: send-error-notification
        image: quay.io/konflux-ci/appstudio-utils:latest
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-webhook
              key: url
        script: |
          #!/bin/bash
          set -euo pipefail

          PIPELINE_RUN="$(context.pipelineRun.name)"
          KONFLUX_BASE="https://konflux-ui.apps.stone-prd-rh01.pg1f.p1.openshiftapps.com/ns/crt-redhat-acm-tenant/applications/hypershift-operator"

          echo "=== notify-slack-error ==="
          echo "Pipeline failed before reaching the release gate evaluation."
          echo "PipelineRun: ${PIPELINE_RUN}"

          PAYLOAD=$(cat <<EOFPAYLOAD
          {
            "attachments": [{
              "color": "#D32F2F",
              "blocks": [
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": ":x: *HO Release Gate - Pipeline Error*\nPipeline failed before reaching the evaluation phase. Check PipelineRun logs."}
                },
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "*PipelineRun:*\n<${KONFLUX_BASE}/pipelineruns/${PIPELINE_RUN}/|${PIPELINE_RUN}>"}
                }
              ]
            }]
          }
          EOFPAYLOAD
          )

          SLACK_RETRIES=3
          SLACK_RETRY_DELAY=10
          SLACK_SENT=false

          for attempt in $(seq 1 ${SLACK_RETRIES}); do
            set +e
            CURL_OUTPUT=$(curl -sS -w '\n%{http_code}' -X POST \
              -H 'Content-type: application/json' \
              --data "${PAYLOAD}" \
              "${SLACK_WEBHOOK_URL}" 2>&1)
            CURL_RC=$?
            set -e

            HTTP_CODE=$(echo "${CURL_OUTPUT}" | tail -1)
            CURL_BODY=$(echo "${CURL_OUTPUT}" | sed '$d')

            if [[ ${CURL_RC} -ne 0 ]]; then
              echo "ERROR: curl failed (exit code ${CURL_RC}, attempt ${attempt}/${SLACK_RETRIES})"
              echo "  curl output: ${CURL_BODY}"
              if [[ ${attempt} -lt ${SLACK_RETRIES} ]]; then
                echo "  retrying in ${SLACK_RETRY_DELAY}s..."
                sleep ${SLACK_RETRY_DELAY}
              fi
              continue
            fi

            if [[ "${HTTP_CODE}" == "200" ]]; then
              echo "Slack error notification sent (attempt ${attempt})"
              SLACK_SENT=true
              break
            else
              echo "WARN: Slack returned HTTP ${HTTP_CODE} (attempt ${attempt}/${SLACK_RETRIES})"
              echo "  response: ${CURL_BODY}"
              if [[ ${attempt} -lt ${SLACK_RETRIES} ]]; then
                echo "  retrying in ${SLACK_RETRY_DELAY}s..."
                sleep ${SLACK_RETRY_DELAY}
              fi
            fi
          done

          if [[ "${SLACK_SENT}" != "true" ]]; then
            echo "ERROR: Slack error notification failed after ${SLACK_RETRIES} attempts"
          fi
          echo "=== notify-slack-error: done ==="
